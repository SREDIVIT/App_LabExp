<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App - Exp 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <header class="header">
      <h1>Notes Flow</h1>
      <p>Organize your thoughts with MongoDB & Express</p>
    </header>

    <div class="main-content">
      <!-- Form Section -->
      <section class="card form-card">
        <h2>Add New Note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Note title..." required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="General">General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Ideas">Ideas</option>
            </select>
          </div>
          <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" rows="4" placeholder="Write your note here..." required></textarea>
          </div>
          <button type="submit" class="btn-primary">Save Note</button>
        </form>
      </section>

      <!-- Notes List Section -->
      <section class="notes-section">
        <div class="notes-header">
          <h2>Your Notes</h2>
          <input type="text" id="search" placeholder="Search notes..." class="search-input">
        </div>
        <div id="notes-grid" class="notes-grid"></div>
        <div id="empty-state" class="empty-state hidden">No notes found. Create your first note!</div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow - Minimalist Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1>Task Flow</h1>
      <p class="subtitle">Streamline your daily focus</p>
    </header>

    <form id="task-form" class="task-form">
      <div class="input-group">
        <input type="text" id="task-input" placeholder="What needs to be done?" required autocomplete="off">
        <select id="priority-select">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
        <button type="submit" class="btn-add">Add Task</button>
      </div>
    </form>

    <section class="task-controls">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div id="task-stats" class="task-stats">0 tasks left</div>
    </section>

    <ul id="task-list" class="task-list"></ul>
    
    <div id="empty-state" class="empty-state hidden">
      <p>No tasks found. Relax or add a new task!</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>

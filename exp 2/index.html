<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 2 - Client-Side Form Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <span class="badge">Experiment 2</span>
            <h1>User Registration Form</h1>
            <p>Interactive Client-Side Form Validation using HTML5 & JavaScript</p>
        </header>

        <main class="form-card">
            <form id="registrationForm" novalidate>
                <!-- Full Name -->
                <div class="form-group" id="group-fullname">
                    <label for="fullName"><i class="fa-solid fa-user"></i> Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullName" placeholder="John Doe" autocomplete="off">
                        <i class="fa-solid fa-circle-check status-icon valid"></i>
                        <i class="fa-solid fa-circle-xmark status-icon invalid"></i>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <!-- Email Address -->
                <div class="form-group" id="group-email">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="john.doe@example.com" autocomplete="off">
                        <i class="fa-solid fa-circle-check status-icon valid"></i>
                        <i class="fa-solid fa-circle-xmark status-icon invalid"></i>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <!-- Phone Number -->
                <div class="form-group" id="group-phone">
                    <label for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="9876543210" maxlength="10" autocomplete="off">
                        <i class="fa-solid fa-circle-check status-icon valid"></i>
                        <i class="fa-solid fa-circle-xmark status-icon invalid"></i>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <!-- Date of Birth -->
                <div class="form-group" id="group-dob">
                    <label for="dob"><i class="fa-solid fa-calendar-days"></i> Date of Birth (18+ only)</label>
                    <div class="input-wrapper">
                        <input type="date" id="dob">
                        <i class="fa-solid fa-circle-check status-icon valid"></i>
                        <i class="fa-solid fa-circle-xmark status-icon invalid"></i>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <!-- Password -->
                <div class="form-group" id="group-password">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••">
                        <i class="fa-solid fa-eye toggle-pwd" id="togglePassword"></i>
                    </div>
                    <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
                    <small class="error-msg"></small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group" id="group-confirmPassword">
                    <label for="confirmPassword"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="••••••••">
                        <i class="fa-solid fa-circle-check status-icon valid"></i>
                        <i class="fa-solid fa-circle-xmark status-icon invalid"></i>
                    </div>
                    <small class="error-msg"></small>
                </div>

                <!-- Terms & Conditions -->
                <div class="form-group checkbox-group" id="group-terms">
                    <label class="checkbox-container">
                        <input type="checkbox" id="terms">
                        <span class="checkmark"></span>
                        I agree to the <a href="#">Terms & Conditions</a>
                    </label>
                    <small class="error-msg"></small>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="submit" class="btn btn-submit"><i class="fa-solid fa-paper-plane"></i> Register Now</button>
                    <button type="reset" class="btn btn-reset" id="resetBtn"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                </div>
            </form>

            <!-- Success Alert Box -->
            <div id="successBox" class="success-box hidden">
                <i class="fa-solid fa-circle-check"></i>
                <div>
                    <h3>Registration Successful!</h3>
                    <p>All client-side form validations passed cleanly.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
